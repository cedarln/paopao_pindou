<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes, maximum-scale=10">
<title>泡泡拼豆</title>
<style>
  :root { --ink:#333; --line:#e8e8e8; --accent:#e0526e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif; background:#f6f6f8; color:var(--ink); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:10px 12px; display:flex; align-items:center; gap:8px; position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-size:16px; flex:1; }
  header h1 small { color:#bbb; font-weight:400; font-size:11px; }
  .bar { background:#fff; border-bottom:1px solid var(--line); padding:8px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:12px; }
  button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 12px; font-size:13px; cursor:pointer; color:var(--ink); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:active { filter:brightness(.92); }
  label { display:flex; align-items:center; gap:4px; white-space:nowrap; }
  input[type=range] { width:110px; accent-color:var(--accent); }
  .num { min-width:26px; text-align:center; font-weight:600; }
  input[type=text].stock { flex:1; min-width:150px; border:1px solid var(--line); border-radius:8px; padding:7px 9px; font-size:12px; color:var(--ink); }
  #stockInfo { font-size:11px; color:#999; }
  button.mini { padding:5px 9px; font-size:12px; border-radius:6px; }
  button.mini.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #stats { font-size:11px; color:#999; padding:6px 12px; }
  .tip { font-size:11px; color:#8a8a8e; padding:6px 12px; background:#fff; border-bottom:1px solid var(--line); }
  #stage { overflow:auto; padding:8px; }
  #chart { background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.08); display:block; image-rendering:pixelated; }
  #chart.fit { width:100%; height:auto; }
  #empty { text-align:center; color:#aaa; font-size:13px; padding:40px 20px; }
</style>
</head>
<body>
<header>
  <h1>泡泡拼豆 <small id="ver">MARD 221 色号</small></h1>
  <button onclick="checkUpdate()">检查更新</button>
</header>
<div class="bar">
  <button class="primary" onclick="document.getElementById('file').click()">上传图片</button>
  <input type="file" id="file" accept="image/*" style="display:none">
  <button onclick="savePNG()">保存图纸</button>
  <button onclick="sharePNG()">分享</button>
  <button onclick="copyList()">备料清单</button>
</div>
<div class="bar">
  <label>宽度 <input type="range" id="width" min="16" max="120" value="50"><span class="num" id="widthVal">50</span>格</label>
  <label><input type="checkbox" id="merge" checked> 减色</label>
  <label><input type="checkbox" id="dither"> 抖动</label>
  <label><input type="checkbox" id="fit" checked> 适应宽度</label>
</div>
<div class="bar">
  <label>限色 <input type="range" id="maxColors" min="8" max="221" value="221"><span class="num" id="maxColorsVal">221</span>色</label>
  <button class="mini preset" data-n="72">72</button>
  <button class="mini preset" data-n="96">96</button>
  <button class="mini preset" data-n="144">144</button>
  <button class="mini preset" data-n="221">221</button>
  <label><input type="checkbox" id="stockOn"> 只用我有豆</label>
  <input type="text" id="stockCodes" class="stock" placeholder="商家库存色号，如 A1 A5 F2 H7">
  <span id="stockInfo"></span>
</div>
<div id="stats"></div>
<div class="tip">发代拼商家：用「保存图纸」的高清 PNG，微信选「原图」或以文件发送；普通图片会被压缩糊掉色号。</div>
<div class="tip">商家说没有某个颜色？勾「只用我有豆」把商家色号粘进去；或点 72/96/144/221 预设、拖「限色」滑杆控制颜色数（221=不限）。</div>
<div id="stage"><canvas id="chart" class="fit"></canvas></div>

/* ===== 色彩科学：sRGB -> Lab -> CIEDE2000 ===== */
function rgb2lab(r,g,b){
  let R=r/255,G=g/255,B=b/255;
  R=R>0.04045?Math.pow((R+0.055)/1.055,2.4):R/12.92;
  G=G>0.04045?Math.pow((G+0.055)/1.055,2.4):G/12.92;
  B=B>0.04045?Math.pow((B+0.055)/1.055,2.4):B/12.92;
  let X=(R*0.4124+G*0.3576+B*0.1805)/0.95047;
  let Y=(R*0.2126+G*0.7152+B*0.0722);
  let Z=(R*0.0193+G*0.1192+B*0.9505)/1.08883;
  const f=t=>t>0.008856?Math.cbrt(t):(7.787*t+16/116);
  X=f(X);Y=f(Y);Z=f(Z);
  return [116*Y-16, 500*(X-Y), 200*(Y-Z)];
}
function ciede2000(l1,a1,b1,l2,a2,b2){
  const rad=Math.PI/180, deg=180/Math.PI;
  const C1=Math.sqrt(a1*a1+b1*b1), C2=Math.sqrt(a2*a2+b2*b2);
  const Cb=(C1+C2)/2, Cb7=Math.pow(Cb,7);
  const G=0.5*(1-Math.sqrt(Cb7/(Cb7+Math.pow(25,7))));
  const a1p=(1+G)*a1, a2p=(1+G)*a2;
  const C1p=Math.sqrt(a1p*a1p+b1*b1), C2p=Math.sqrt(a2p*a2p+b2*b2);
  let h1p=Math.atan2(b1,a1p)*deg; if(h1p<0)h1p+=360;
  let h2p=Math.atan2(b2,a2p)*deg; if(h2p<0)h2p+=360;
  const dLp=l2-l1, dCp=C2p-C1p;
  let dhp=0;
  if(C1p*C2p!==0){
    dhp=h2p-h1p;
    if(dhp>180)dhp-=360; else if(dhp<-180)dhp+=360;
  }
  const dHp=2*Math.sqrt(C1p*C2p)*Math.sin(dhp/2*rad);
  const Lbp=(l1+l2)/2, Cbp=(C1p+C2p)/2;
  let hbp=h1p+h2p;
  if(C1p*C2p!==0){
    if(Math.abs(h1p-h2p)>180) hbp=(h1p+h2p<360)?(h1p+h2p+360)/2:(h1p+h2p-360)/2;
    else hbp=(h1p+h2p)/2;
  } else hbp=h1p+h2p;
  const T=1-0.17*Math.cos((hbp-30)*rad)+0.24*Math.cos(2*hbp*rad)+0.32*Math.cos((3*hbp+6)*rad)-0.20*Math.cos((4*hbp-63)*rad);
  const dTheta=30*Math.exp(-Math.pow((hbp-275)/25,2));
  const Cbp7=Math.pow(Cbp,7);
  const Rc=2*Math.sqrt(Cbp7/(Cbp7+Math.pow(25,7)));
  const Sl=1+0.015*Math.pow(Lbp-50,2)/Math.sqrt(20+Math.pow(Lbp-50,2));
  const Sc=1+0.045*Cbp, Sh=1+0.015*Cbp*T;
  const Rt=-Math.sin(2*dTheta*rad)*Rc;
  const dl=dLp/Sl, dc=dCp/Sc, dh=dHp/Sh;
  return Math.sqrt(dl*dl+dc*dc+dh*dh+Rt*dc*dh);
}

/* 预处理色卡 */
const COLORS = Object.entries(PALETTE).map(([code,hex])=>{
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const lab=rgb2lab(r,g,b);
  const lum=0.299*r+0.587*g+0.114*b;
  return {code,hex,r,g,b,lab,text:lum>150?"#333":"#fff"};
}).sort((x,y)=> x.code[0]===y.code[0] ? parseInt(x.code.slice(1))-parseInt(y.code.slice(1)) : x.code.localeCompare(y.code));

let activeColors=COLORS;
const matchCache=new Map();
function nearest(r,g,b){
  const key=(r<<16)|(g<<8)|b;
  if(matchCache.has(key)) return matchCache.get(key);
  const lab=rgb2lab(r,g,b);
  let best=null,bd=Infinity;
  for(const c of activeColors){
    const d=ciede2000(lab[0],lab[1],lab[2],c.lab[0],c.lab[1],c.lab[2]);
    if(d<bd){bd=d;best=c;}
  }
  matchCache.set(key,best);
  return best;
}
/* 商家库存白名单：解析粘贴的色号，只允许在这些颜色里匹配 */
function parseStock(){
  const raw=document.getElementById('stockCodes').value.toUpperCase();
  const found=new Set(raw.match(/[A-M]\d{1,2}/g)||[]);
  const valid=new Set([...found].filter(code=>PALETTE[code]));
  return valid.size?valid:null;
}
function refreshPalette(){
  const set=document.getElementById('stockOn').checked?parseStock():null;
  activeColors=set?COLORS.filter(c=>set.has(c.code)):COLORS;
  matchCache.clear(); // 色板变了，像素->色号缓存作废
  updateStockInfo();
}
function updateStockInfo(){
  const el=document.getElementById('stockInfo');
  if(!document.getElementById('stockOn').checked){ el.textContent=""; return; }
  const set=parseStock();
  el.textContent=set?`已识别 ${set.size} 色`:"未识别到有效色号";
}
function curMax(){ return parseInt(document.getElementById('maxColors').value)||221; }
function paletteNote(){
  const parts=[];
  if(document.getElementById('stockOn').checked){
    const set=parseStock();
    parts.push(set?`库存 ${set.size} 色`:"库存未生效");
  }
  const max=curMax();
  if(max<221) parts.push(`限 ${max} 色`);
  return parts.length?" · "+parts.join(" · "):"";
}

/* ===== 状态 ===== */
let srcImage=null;
let grid=null;

function loadSample(){
  const img=new Image();
  img.onload=()=>{ srcImage=img; regenerate(); };
  img.src=SAMPLE_IMG;
}
function loadFile(file){
  if(!file || !file.type.startsWith('image/')) return;
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{ srcImage=img; regenerate(); URL.revokeObjectURL(url); };
  img.src=url;
}

/* ===== 像素化 + 匹配 ===== */
function regenerate(){
  if(!srcImage) return;
  syncPreset();
  const W=parseInt(document.getElementById('width').value);
  const H=Math.max(1,Math.round(W*srcImage.height/srcImage.width));
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const cx=cv.getContext('2d',{willReadFrequently:true});
  cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality='high';
  cx.drawImage(srcImage,0,0,W,H);
  const data=cx.getImageData(0,0,W,H).data;
  const dither=document.getElementById('dither').checked;
  const buf=new Float32Array(W*H*3);
  for(let i=0;i<W*H;i++){ buf[i*3]=data[i*4]; buf[i*3+1]=data[i*4+1]; buf[i*3+2]=data[i*4+2]; }
  const cells=new Array(W*H).fill(null);
  const clamp=v=>Math.max(0,Math.min(255,Math.round(v)));
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const i=y*W+x;
      if(data[i*4+3]<128) continue; // 透明 -> 空格
      const r=clamp(buf[i*3]),g=clamp(buf[i*3+1]),b=clamp(buf[i*3+2]);
      const c=nearest(r,g,b);
      cells[i]=c;
      if(dither){
        const er=r-c.r, eg=g-c.g, eb=b-c.b;
        const spread=(dx,dy,f)=>{
          const nx=x+dx,ny=y+dy;
          if(nx<0||nx>=W||ny>=H) return;
          const j=(ny*W+nx)*3;
          if(data[(ny*W+nx)*4+3]<128) return;
          buf[j]+=er*f; buf[j+1]+=eg*f; buf[j+2]+=eb*f;
        };
        spread(1,0,7/16); spread(-1,1,3/16); spread(0,1,5/16); spread(1,1,1/16);
      }
    }
  }
  if(document.getElementById('merge').checked) mergeRareColors(cells);
  const max=curMax();
  if(max<221) reduceToMaxColors(cells,max);
  grid={w:W,h:H,cells};
  render();
}

/* 智能减色：把占比过低的杂色并入感知色差最近的保留色，迭代到稳定 */
const colorDistCache=new Map();
function colorDist(a,b){
  const key=a.code<b.code?a.code+"|"+b.code:b.code+"|"+a.code;
  if(!colorDistCache.has(key)){
    colorDistCache.set(key,ciede2000(a.lab[0],a.lab[1],a.lab[2],b.lab[0],b.lab[1],b.lab[2]));
  }
  return colorDistCache.get(key);
}
function mergeRareColors(cells){
  const counts=new Map();
  let total=0;
  for(const c of cells){ if(c){ counts.set(c.code,(counts.get(c.code)||0)+1); total++; } }
  const threshold=Math.max(4,Math.round(total*0.008));
  const byCode=new Map(COLORS.map(c=>[c.code,c]));
  const active=new Set(counts.keys());
  while(true){
    let rarest=null,rc=Infinity;
    for(const code of active){
      const n=counts.get(code);
      if(n<threshold && n<rc){rc=n;rarest=code;}
    }
    if(!rarest) break;
    active.delete(rarest);
    const from=byCode.get(rarest);
    let best=null,bd=Infinity;
    for(const code of active){
      const d=colorDist(from,byCode.get(code));
      if(d<bd){bd=d;best=byCode.get(code);}
    }
    for(let i=0;i<cells.length;i++){
      if(cells[i]&&cells[i].code===rarest) cells[i]=best;
    }
    counts.set(best.code,(counts.get(best.code)||0)+rc);
    counts.delete(rarest);
  }
}
/* 限色：把用到的颜色减到不超过 K 种——每轮把最少的一种并入感知色差最近的保留色 */
function reduceToMaxColors(cells,K){
  const counts=new Map();
  for(const c of cells){ if(c) counts.set(c.code,(counts.get(c.code)||0)+1); }
  const byCode=new Map(COLORS.map(c=>[c.code,c]));
  const active=new Set(counts.keys());
  while(active.size>K){
    let rarest=null,rc=Infinity;
    for(const code of active){
      const n=counts.get(code);
      if(n<rc){rc=n;rarest=code;}
    }
    active.delete(rarest);
    const from=byCode.get(rarest);
    let best=null,bd=Infinity;
    for(const code of active){
      const d=colorDist(from,byCode.get(code));
      if(d<bd){bd=d;best=byCode.get(code);}
    }
    if(!best) break;
    for(let i=0;i<cells.length;i++){
      if(cells[i]&&cells[i].code===rarest) cells[i]=best;
    }
    counts.set(best.code,(counts.get(best.code)||0)+rc);
    counts.delete(rarest);
  }
}

/* ===== 图纸渲染 ===== */
function currentCounts(){
  const counts=new Map(); let total=0;
  for(const c of grid.cells){ if(c){ counts.set(c.code,(counts.get(c.code)||0)+1); total++; } }
  return {counts,total,legend:COLORS.filter(c=>counts.has(c.code))};
}
function render(){
  // 高分辨率 backing：放大看色号不糊。格子上限 64px，总像素封顶 ~16M 防内存爆
  const cell=Math.max(20,Math.min(64,Math.floor(Math.sqrt(16e6/((grid.w+3)*(grid.h+3))))));
  drawChart(document.getElementById('chart'), cell);
}

function drawChart(canvas, cell){
  if(!grid) return;
  const {w,h,cells}=grid;
  const {counts,total,legend}=currentCounts();
  const margin=Math.round(cell*1.5);
  const titleH=Math.round(cell*2.6);
  const chipW=Math.round(cell*4.6), chipH=Math.round(cell*1.15), chipGap=Math.round(cell*0.4);
  const perRow=Math.max(1,Math.floor((w*cell+2*margin)/(chipW+chipGap)));
  const legendRows=Math.ceil(legend.length/perRow);
  const legendH=legendRows*(chipH+chipGap)+chipGap*2;
  const footH=Math.round(cell*1.2);
  canvas.width=w*cell+2*margin;
  canvas.height=h*cell+2*margin+titleH+legendH+footH;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
  const ox=margin, oy=margin+titleH;
  // v1.4 方案B：颂拼豆同款两行标题，第二行带「· MARD色号」小标注（商家认这套版式）
  ctx.textAlign="left"; ctx.textBaseline="middle";
  ctx.fillStyle="#222"; ctx.font=`bold ${Math.round(cell*0.9)}px sans-serif`;
  ctx.fillText("泡泡拼豆", 4, titleH*0.3);
  ctx.font=`${Math.round(cell*0.72)}px sans-serif`;
  ctx.fillText(`©临安 [${w}x${h}/${legend.length}色/共${total}颗] · MARD色号`, 4, titleH*0.72);
  const codeFont=`${Math.max(4,Math.round(cell*0.42))}px sans-serif`;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const c=cells[y*w+x];
      const px=ox+x*cell, py=oy+y*cell;
      if(c){
        ctx.fillStyle=c.hex; ctx.fillRect(px,py,cell,cell);
        if(cell>=9){
          ctx.fillStyle=c.text; ctx.font=codeFont; ctx.textAlign="center";
          ctx.fillText(c.code, px+cell/2, py+cell/2+0.5);
        }
      }
    }
  }
  // 细灰线 + 每5格红线（颂拼豆版式）
  ctx.strokeStyle="#c9c9c9"; ctx.lineWidth=0.5;
  ctx.beginPath();
  for(let x=1;x<w;x++){ if(x%5===0) continue; ctx.moveTo(ox+x*cell,oy); ctx.lineTo(ox+x*cell,oy+h*cell); }
  for(let y=1;y<h;y++){ if(y%5===0) continue; ctx.moveTo(ox,oy+y*cell); ctx.lineTo(ox+w*cell,oy+y*cell); }
  ctx.stroke();
  ctx.strokeStyle="#e0526e"; ctx.lineWidth=Math.max(1,cell*0.08);
  ctx.beginPath();
  for(let x=0;x<=w;x+=5){ ctx.moveTo(ox+x*cell,oy); ctx.lineTo(ox+x*cell,oy+h*cell); }
  for(let y=0;y<=h;y+=5){ ctx.moveTo(ox,oy+y*cell); ctx.lineTo(ox+w*cell,oy+y*cell); }
  ctx.stroke();
  // 四周行列号
  ctx.fillStyle="#888"; ctx.font=`${Math.max(5,Math.round(cell*0.36))}px sans-serif`; ctx.textAlign="center";
  for(let x=0;x<w;x++){
    ctx.fillText(x+1, ox+x*cell+cell/2, oy-cell*0.55);
    ctx.fillText(x+1, ox+x*cell+cell/2, oy+h*cell+cell*0.55);
  }
  for(let y=0;y<h;y++){
    ctx.textAlign="right"; ctx.fillText(y+1, ox-cell*0.3, oy+y*cell+cell/2);
    ctx.textAlign="left"; ctx.fillText(y+1, ox+w*cell+cell*0.3, oy+y*cell+cell/2);
  }
  // 图例：色块内写色号、颗数放块右（颂拼豆样式）
  let ly=oy+h*cell+margin+chipGap;
  legend.forEach((c,i)=>{
    const row=Math.floor(i/perRow), col=i%perRow;
    const lx=ox+col*(chipW+chipGap);
    const yy=ly+row*(chipH+chipGap);
    const boxW=Math.round(chipW*0.52);
    ctx.fillStyle=c.hex; ctx.fillRect(lx,yy,boxW,chipH);
    ctx.strokeStyle="#bbb"; ctx.lineWidth=0.5; ctx.strokeRect(lx+0.25,yy+0.25,boxW,chipH);
    if(cell>=9){
      ctx.fillStyle=c.text; ctx.font=codeFont; ctx.textAlign="center";
      ctx.fillText(c.code, lx+boxW/2, yy+chipH/2+0.5);
      ctx.fillStyle="#222"; ctx.textAlign="left";
      ctx.fillText(String(counts.get(c.code)), lx+boxW+4, yy+chipH/2+0.5);
    }
  });
  ctx.fillStyle="#999"; ctx.font=`${Math.max(5,Math.round(cell*0.38))}px sans-serif`; ctx.textAlign="left";
  const stockActive=document.getElementById('stockOn').checked && parseStock();
  ctx.fillText(stockActive?`色号范围：商家库存 ${activeColors.length} 色 · 配色以实物色卡为准`:`色号体系 MARD 221（A~M）· 配色以实物色卡为准`, 4, canvas.height-footH/2);
  document.getElementById('stats').textContent =
    `${w}×${h} 格 · ${total} 颗豆 · ${legend.length} 种色号${paletteNote()} · 双指缩放查看色号`;
}

/* ===== 导出 / 分享 / 清单 / 更新 ===== */
function exportDataURL(){
  const cv=document.createElement('canvas');
  drawChart(cv,40);
  const url=cv.toDataURL('image/png');
  render();
  return url;
}
function fileName(){ return `拼豆图纸-MARD-${grid.w}x${grid.h}.png`; }

function savePNG(){
  if(!grid) return;
  const url=exportDataURL();
  if(HAS_NATIVE){ Android.saveImage(url, fileName()); }
  else { const a=document.createElement('a'); a.download=fileName(); a.href=url; a.click(); }
}
function sharePNG(){
  if(!grid) return;
  const url=exportDataURL();
  if(HAS_NATIVE){ Android.shareImage(url, fileName()); }
  else if(navigator.share){
    fetch(url).then(r=>r.blob()).then(b=>navigator.share({files:[new File([b],fileName(),{type:'image/png'})]})).catch(()=>{});
  } else { savePNG(); }
}
function copyList(){
  if(!grid) return;
  const {counts,total,legend}=currentCounts();
  const lines=[`拼豆备料清单 · MARD 221 色号（A~M）`,`图纸 ${grid.w}×${grid.h} 格 · 共 ${total} 颗 · ${legend.length} 种色号`,""];
  for(const c of legend) lines.push(`${c.code} × ${counts.get(c.code)}`);
  const text=lines.join("\n");
  if(HAS_NATIVE){ Android.copyText(text); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>alert("备料清单已复制")); }
  else { prompt("长按复制备料清单：", text); }
}
function checkUpdate(){
  if(HAS_NATIVE){ Android.checkUpdate(); }
  else { alert("请在安卓 App 内使用检查更新"); }
}

document.getElementById('maxColors').addEventListener('change',regenerate);

document.getElementById('stockCodes').addEventListener('change',()=>{refreshPalette();regenerate();});
document.getElementById('fit').addEventListener('change',e=>{
  document.getElementById('chart').classList.toggle('fit', e.target.checked);

/* 常用色预设：一键把限色设到 72/96/144/221 */
function syncPreset(){
  const v=curMax();
  document.getElementById('maxColorsVal').textContent=v;
  document.querySelectorAll('button.preset').forEach(b=>b.classList.toggle('on', parseInt(b.dataset.n)===v));
}
document.querySelectorAll('button.preset').forEach(b=>b.addEventListener('click',()=>{
  document.getElementById('maxColors').value=b.dataset.n;
  regenerate();
}));
if(HAS_NATIVE){ document.getElementById('ver').textContent = "MARD 221 色号 · v"+Android.version(); }

loadSample();

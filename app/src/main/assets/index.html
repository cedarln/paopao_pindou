<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes, maximum-scale=10">
<title>泡泡拼豆</title>
<style>
  :root { --ink:#333; --line:#e8e8e8; --accent:#e0526e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif; background:#f6f6f8; color:var(--ink); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:10px 12px; display:flex; align-items:center; gap:8px; position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-size:16px; flex:1; }
  header h1 small { color:#bbb; font-weight:400; font-size:11px; }
  .bar { background:#fff; border-bottom:1px solid var(--line); padding:8px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:12px; }
  .bar select { font-size:12px; padding:3px 4px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); }
  button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 12px; font-size:13px; cursor:pointer; color:var(--ink); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:active { filter:brightness(.92); }
  label { display:flex; align-items:center; gap:4px; white-space:nowrap; }
  input[type=range] { width:110px; accent-color:var(--accent); }
  .num { min-width:26px; text-align:center; font-weight:600; }
  input[type=text].stock { flex:1; min-width:150px; border:1px solid var(--line); border-radius:8px; padding:7px 9px; font-size:12px; color:var(--ink); }
  #stockInfo { font-size:11px; color:#999; }
  button.mini { padding:5px 9px; font-size:12px; border-radius:6px; }
  button.mini.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.mini.dim { opacity:.4; }
  #curColors { font-size:11px; color:#999; white-space:nowrap; }
  #stats { font-size:11px; color:#999; padding:6px 12px; }
  .tip { font-size:11px; color:#8a8a8e; padding:6px 12px; background:#fff; border-bottom:1px solid var(--line); }
  #stage { overflow:auto; padding:8px; }
  #chart { background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.08); display:block; image-rendering:pixelated; }
  #chart.fit { width:100%; height:auto; }
  #empty { text-align:center; color:#aaa; font-size:13px; padding:40px 20px; }
  /* 顶层模式切换：模式卡片 */
  #modeCards { display:flex; gap:10px; padding:12px; background:#fff; border-bottom:1px solid var(--line); }
  .mcard { flex:1; border:1px solid var(--line); border-radius:12px; padding:10px; background:#fbfbfd; cursor:pointer; }
  .mcard.on { border-color:var(--accent); box-shadow:0 0 0 2px rgba(224,82,110,.15); background:#fff; }
  .mcard .mt { font-size:15px; font-weight:700; margin-bottom:3px; }
  .mcard.on .mt { color:var(--accent); }
  .mcard .md { font-size:11px; color:#9a9a9e; line-height:1.5; min-height:32px; }
  .mcard .mprev { margin-top:8px; height:64px; border-radius:8px; border:1px solid var(--line); background:#fff; overflow:hidden; }
  .mcard .mprev svg { display:block; width:100%; height:100%; }
  /* 自由调色盘 */
  .tray { gap:6px; flex-wrap:nowrap; }
  #trayLabel { font-size:11px; color:#999; white-space:nowrap; }
  #tray { display:flex; flex:1 1 auto; min-width:0; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; gap:5px; align-items:center; padding-bottom:2px; }
  .sw { flex:0 0 auto; width:24px; height:24px; border-radius:7px; border:1px solid rgba(0,0,0,.18); cursor:pointer; padding:0; }
  .sw.on { outline:2px solid var(--accent); outline-offset:1px; }
  .sw.auto { width:auto; padding:0 9px; font-size:11px; background:#fff; color:var(--ink); }
  #customColor { width:30px; height:26px; padding:0; border:1px solid var(--line); border-radius:7px; background:#fff; }
  .pick { display:flex; align-items:center; gap:4px; font-size:11px; color:#666; white-space:nowrap; flex:0 0 auto; }
  /* 表格弹窗：先看表，确认无误再导出到相册 */
  #sheetMask { position:fixed; inset:0; background:rgba(20,20,24,.42); z-index:30; display:none; }
  #sheetMask.on { display:flex; }
  #sheetCard { background:#fff; margin:auto; width:min(94vw,720px); max-height:88vh; border-radius:14px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,.28); }
  #sheetHd { padding:11px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  #sheetHd b { flex:1; font-size:14px; }
  #sheetHd small { color:#9a9a9e; font-size:11px; font-weight:400; }
  #sheetBody { overflow:auto; padding:0 14px; -webkit-overflow-scrolling:touch; font-size:12px; }
  #sheetBody .sec { font-size:11px; color:#8a8a8e; padding:10px 0 6px; line-height:1.6; }
  table.tb { border-collapse:collapse; width:100%; }
  table.tb th { position:sticky; top:0; background:#fff; color:#8a8a8e; font-weight:400; font-size:11px; text-align:left; padding:7px 6px; border-bottom:1px solid #c9c9ce; z-index:1; }
  table.tb td { padding:6px; border-bottom:1px solid #f0f0f2; vertical-align:middle; }
  table.tb td.c { text-align:center; font-weight:600; }
  table.tb td.mut { color:#777; }
  table.tb td.mono { font-family:ui-monospace,Menlo,monospace; color:#666; font-size:11px; }
  table.tb i.chip { display:block; width:30px; height:15px; border-radius:4px; border:1px solid rgba(0,0,0,.18); }
  #sheetFt { padding:10px 14px; border-top:1px solid var(--line); display:flex; gap:8px; }
  #sheetFt button { flex:1; }
</style>
</head>
<body>
<header>
  <h1>泡泡拼豆 <small id="ver">MARD 221 色号</small></h1>
  <button onclick="checkUpdate()">检查更新</button>
</header>


<!-- 顶层模式：拼豆图纸 / 数字油画（两个模式平级，卡片即切换入口） -->
<div id="modeCards">
  <div class="mcard" data-m="bead" onclick="setMode('bead')">
    <div class="mt">拼豆图纸</div>
    <div class="md">按色号数豆、备料，发代拼商家</div>
    <div class="mprev"><svg viewBox="0 0 60 30" preserveAspectRatio="none">
      <rect x="0" y="0" width="20" height="15" fill="#f6d365"/><rect x="20" y="0" width="20" height="15" fill="#f0a35e"/><rect x="40" y="0" width="20" height="15" fill="#fbe9b8"/>
      <rect x="0" y="15" width="20" height="15" fill="#8ec9a3"/><rect x="20" y="15" width="20" height="15" fill="#4c9e7a"/><rect x="40" y="15" width="20" height="15" fill="#f6d365"/>
      <path d="M20 0V30M40 0V30M0 15H60" stroke="#c9c9c9" stroke-width=".7"/><path d="M0 0H60V30H0Z" stroke="#e0526e" stroke-width="1.1" fill="none"/>
      <text x="4" y="10" font-size="6" fill="#7a5b00">A5</text><text x="24" y="25" font-size="6" fill="#0e4d33">H7</text>
    </svg></div>
  </div>
  <div class="mcard" data-m="pbn" onclick="setMode('pbn')">
    <div class="mt">数字油画</div>
    <div class="md">曲线分区在线填色，可自取颜色</div>
    <div class="mprev"><svg viewBox="0 0 60 30" preserveAspectRatio="none">
      <rect width="60" height="30" fill="#e3e4e9"/>
      <path d="M4 22C10 8 26 4 34 12s14 4 20-2v22H4Z" fill="#8ec9a3" stroke="#4a4a52" stroke-width=".8"/>
      <path d="M10 26c6-10 20-8 24 0Z" fill="#f6d365" stroke="#4a4a52" stroke-width=".8"/>
      <circle cx="44" cy="9" r="6" fill="#f0a35e" stroke="#4a4a52" stroke-width=".8"/>
      <text x="41" y="11" font-size="5" fill="#5c2d00">3</text><text x="18" y="21" font-size="5" fill="#5b4400">2</text>
    </svg></div>
  </div>
</div>

<div class="bar">
  <button class="primary" onclick="document.getElementById('file').click()">上传图片</button>
  <input type="file" id="file" accept="image/*" style="display:none">
  <button onclick="savePNG()" id="btnSave">保存图纸</button>
  <button onclick="sharePNG()">分享</button>
  <button onclick="openSheet('nums')" id="btnList">备料清单</button>
</div>

<div id="beadGroup">
  <div class="bar">
    <label>宽度 <input type="range" id="width" min="16" max="120" value="50"><span class="num" id="widthVal">50</span>格</label>
    <label><input type="checkbox" id="merge" checked> 减色</label>
    <label><input type="checkbox" id="dither"> 抖动</label>
    <label><input type="checkbox" id="fit" checked> 适应宽度</label>
  </div>
  <div class="bar">
    <label>限色 <input type="range" id="maxColors" min="8" max="221" value="221"><span class="num" id="maxColorsVal">221</span>色</label>
    <button class="mini preset" data-n="72">72</button>
    <button class="mini preset" data-n="96">96</button>
    <button class="mini preset" data-n="144">144</button>
    <button class="mini preset" data-n="221">221</button>
    <span id="curColors"></span>
    <label><input type="checkbox" id="stockOn"> 只用我有豆</label>
    <input type="text" id="stockCodes" class="stock" placeholder="商家库存色号，如 A1 A5 F2 H7">
    <span id="stockInfo"></span>
  </div>
</div>

<div class="bar" id="paintBar" style="display:none">
  <label>精细度 <input type="range" id="fine" min="1" max="5" value="3"><span class="num" id="fineVal">标准</span></label>
  <label>色号规则 <select id="paintLine" onchange="setPaintLine(this.value)">
    <option value="acrylic">马利丙烯 · 色号</option>
    <option value="oil">马利油画 · 色号</option>
    <option value="gouache">马利水粉 · 仅色名</option>
    <option value="ral">RAL 经典 · 工业色号</option>
    <option value="hex">十六进制 · 画面色值</option>
  </select></label>
  <button class="mini" onclick="paintUndo()">撤销</button>
  <button class="mini" onclick="paintReset()">重置</button>
  <button class="mini" onclick="saveLineArt()">导出空白线稿</button>
  <button class="mini" onclick="openSheet('sheet')">颜料对照表</button>
  <label><input type="checkbox" id="pbPreview"> 预览成品</label>
  <span id="paintProg"></span>
</div>
<div class="bar tray" id="trayBar" style="display:none">
  <span id="trayLabel">画笔</span>
  <span id="tray"></span>
  <label class="pick">＋自选<input type="color" id="customColor" value="#e0526e"></label>
</div>

<div id="stats"></div>
<div class="tip" id="tipBead1">发代拼商家：用「保存图纸」的高清 PNG，微信选「原图」或以文件发送；普通图片会被压缩糊掉色号。</div>
<div class="tip" id="tipBead2">商家说没有某个颜色？勾「只用我有豆」把商家色号粘进去；或点 72/96/144/221 预设、拖「限色」滑杆控制颜色数（221=不限）。</div>
<div class="tip" id="paintTip" style="display:none">数字油画：画面按颜色自动分成曲线区域。画笔选「自动」点一下就填上该区域本身的颜色；选下面任意色块（或用吸管自选颜色）就能把任意区域涂成你想要的颜色。「精细度」越高区域越多越小，双指放大填小区域；勾「预览成品」直接看填完的样子。</div>
<div id="stage"><canvas id="chart" class="fit"></canvas></div>

<div id="sheetMask" onclick="if(event.target===this)closeSheet()">
  <div id="sheetCard">
    <div id="sheetHd"><b id="sheetTitle">表格</b><small id="sheetHint"></small><button class="mini" onclick="closeSheet()">关闭</button></div>
    <div id="sheetBody"></div>
    <div id="sheetFt">
      <button id="sheetCopy" onclick="copyList()">复制文字</button>
      <button class="primary" onclick="saveSheetImage()">导出到相册</button>
    </div>
  </div>
</div>

<script>

  const f=t=>t>0.008856?Math.cbrt(t):(7.787*t+16/116);
  X=f(X);Y=f(Y);Z=f(Z);
  return [116*Y-16, 500*(X-Y), 200*(Y-Z)];
}
function ciede2000(l1,a1,b1,l2,a2,b2){
  const rad=Math.PI/180, deg=180/Math.PI;
  const C1=Math.sqrt(a1*a1+b1*b1), C2=Math.sqrt(a2*a2+b2*b2);
  const Cb=(C1+C2)/2, Cb7=Math.pow(Cb,7);
  const G=0.5*(1-Math.sqrt(Cb7/(Cb7+Math.pow(25,7))));
  const a1p=(1+G)*a1, a2p=(1+G)*a2;
  const C1p=Math.sqrt(a1p*a1p+b1*b1), C2p=Math.sqrt(a2p*a2p+b2*b2);
  let h1p=Math.atan2(b1,a1p)*deg; if(h1p<0)h1p+=360;
  let h2p=Math.atan2(b2,a2p)*deg; if(h2p<0)h2p+=360;
  const dLp=l2-l1, dCp=C2p-C1p;
  let dhp=0;
  if(C1p*C2p!==0){
    dhp=h2p-h1p;
    if(dhp>180)dhp-=360; else if(dhp<-180)dhp+=360;
  }
  const dHp=2*Math.sqrt(C1p*C2p)*Math.sin(dhp/2*rad);
  const Lbp=(l1+l2)/2, Cbp=(C1p+C2p)/2;
  let hbp=h1p+h2p;
  if(C1p*C2p!==0){
    if(Math.abs(h1p-h2p)>180) hbp=(h1p+h2p<360)?(h1p+h2p+360)/2:(h1p+h2p-360)/2;
    else hbp=(h1p+h2p)/2;
  } else hbp=h1p+h2p;
  const T=1-0.17*Math.cos((hbp-30)*rad)+0.24*Math.cos(2*hbp*rad)+0.32*Math.cos((3*hbp+6)*rad)-0.20*Math.cos((4*hbp-63)*rad);
  const dTheta=30*Math.exp(-Math.pow((hbp-275)/25,2));
  const Cbp7=Math.pow(Cbp,7);
  const Rc=2*Math.sqrt(Cbp7/(Cbp7+Math.pow(25,7)));
  const Sl=1+0.015*Math.pow(Lbp-50,2)/Math.sqrt(20+Math.pow(Lbp-50,2));
  const Sc=1+0.045*Cbp, Sh=1+0.015*Cbp*T;
  const Rt=-Math.sin(2*dTheta*rad)*Rc;
  const dl=dLp/Sl, dc=dCp/Sc, dh=dHp/Sh;
  return Math.sqrt(dl*dl+dc*dc+dh*dh+Rt*dc*dh);
}

const paintCache=new Map();
const FAR_DE=12;   // CIEDE2000 超过这个值就没有真正接近的色了（照片题材常见），标 △ 提示需自调
/** 在当前这条规则里找最接近的一支；十六进制直接回画面自身的色值 */
function paintNearest(c){
  if(paintLine==='hex'){
    const h='#'+c.map(v=>('0'+v.toString(16)).slice(-2)).join('').toUpperCase();
    return {code:'', name:h, hex:h, de:0, far:false};
  }
  const key=paintLine+'|'+c.join(',');
  if(paintCache.has(key)) return paintCache.get(key);
  const pal=paintRule().colors, lab=rgb2lab(c[0],c[1],c[2]);
  let best=pal[0], bd=Infinity;
  for(const p of pal){
    const d=ciede2000(lab[0],lab[1],lab[2],p.lab[0],p.lab[1],p.lab[2]);
    if(d<bd){bd=d;best=p;}
  }
  const hit={code:best.code, name:best.name, hex:best.hex, de:bd, far:bd>FAR_DE};
  paintCache.set(key,hit);
  return hit;
}
function paintTextOf(p,full){
  if(!p.code) return p.name;
  if(!full && paintRule().chipCodeOnly) return p.code;
  return `${p.code} ${p.name}`;
}
/** 图例色 -> 色号/色名；chip 上用最short的形式，差得远的加 △ */
function paintLabels(list,full){
  return list.map(function(c){
    const p=paintNearest(c);
    return paintTextOf(p,full)+(p.far?' △':'');
  });
}
/** 颜料清单：同一支（同色号）合并，记编号和区域数，按用量从多到少排 */
function paintSummary(M,lg){
  const rule=paintRule();
  const names=paintLabels(lg.list);              // 图上用的短标签
  const fulls=paintLabels(lg.list,true);         // 清单/对照表用的全标签
  const blobs=new Array(lg.list.length).fill(0);
  for(const r of M.regions){ const n=lg.nums.get(r.id); if(n) blobs[n-1]++; }
  const map=new Map();
  lg.list.forEach(function(c,i){
    const p=paintNearest(c), key=p.code||p.name;
    if(!map.has(key)) map.set(key,{name:fulls[i], code:p.code, nums:[], cells:0, far:p.far});
    const it=map.get(key); it.nums.push(i+1); it.cells+=blobs[i]; it.far=it.far||p.far;
  });
  const items=[...map.values()].sort((a,b)=>b.cells-a.cells);
  // 同一支被几个编号共用时，只要有一个编号差得远，这一支就得标 △
  items.forEach(it=>{ if(it.far && it.name.indexOf('△')<0) it.name+=' △'; });
  const farN=items.filter(it=>it.far).length;
  const text=`${rule.label} ${items.length}${rule.countWord}（${rule.note}${farN?` · △${farN} 需自调`:''}）：`
    +items.map(function(it){
      const base=it.name.replace(' △','');
      const t=it.nums.length>1?`${base}（${it.nums.join('+')}号）`:base;
      return it.far?t+' △':t;
    }).join('、');
  return {names, items, text, rule, farN};
}
/** 按估算字宽折行（画布高度要先定，这里拿不到 ctx.measureText） */
function pbWrap(text,maxW,fs){
  const lines=[]; let cur='', w=0;
  for(const ch of text){
    const cw=ch.charCodeAt(0)<256?fs*0.55:fs;
    if(w+cw>maxW && cur){ lines.push(cur); cur=''; w=0; }
    cur+=ch; w+=cw;
  }
  if(cur) lines.push(cur);
  return lines;
}

/* 预处理色卡 */
const COLORS = Object.entries(PALETTE).map(([code,hex])=>{
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const lab=rgb2lab(r,g,b);
  const lum=0.299*r+0.587*g+0.114*b;
  return {code,hex,r,g,b,lab,text:lum>150?"#333":"#fff"};
}).sort((x,y)=> x.code[0]===y.code[0] ? parseInt(x.code.slice(1))-parseInt(y.code.slice(1)) : x.code.localeCompare(y.code));

let activeColors=COLORS;
const matchCache=new Map();
function nearest(r,g,b){
  const key=(r<<16)|(g<<8)|b;
  if(matchCache.has(key)) return matchCache.get(key);
  const lab=rgb2lab(r,g,b);
  let best=null,bd=Infinity;
  for(const c of activeColors){
    const d=ciede2000(lab[0],lab[1],lab[2],c.lab[0],c.lab[1],c.lab[2]);
    if(d<bd){bd=d;best=c;}
  }
  matchCache.set(key,best);
  return best;
}

/* ===== 像素化 + 匹配 ===== */
function regenerate(){
  if(!srcImage) return;
  if(isPaint()){
    grid=null;
    if(!paintModel || paintKey!==curPaintKey()){ paintModel=buildPaint(); paintKey=curPaintKey(); }
    render();
    syncPreset();
    return;
  }
  const W=parseInt(document.getElementById('width').value);
  const H=Math.max(1,Math.round(W*srcImage.height/srcImage.width));
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const cx=cv.getContext('2d',{willReadFrequently:true});
  cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality='high';
  cx.drawImage(srcImage,0,0,W,H);
  const data=cx.getImageData(0,0,W,H).data;
  const dither=document.getElementById('dither').checked;
  const buf=new Float32Array(W*H*3);
  for(let i=0;i<W*H;i++){ buf[i*3]=data[i*4]; buf[i*3+1]=data[i*4+1]; buf[i*3+2]=data[i*4+2]; }
  const cells=new Array(W*H).fill(null);
  const clamp=v=>Math.max(0,Math.min(255,Math.round(v)));
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const i=y*W+x;
      if(data[i*4+3]<128) continue; // 透明 -> 空格
      const r=clamp(buf[i*3]),g=clamp(buf[i*3+1]),b=clamp(buf[i*3+2]);
      const c=nearest(r,g,b);
      cells[i]=c;
      if(dither){
        const er=r-c.r, eg=g-c.g, eb=b-c.b;
        const spread=(dx,dy,f)=>{
          const nx=x+dx,ny=y+dy;
          if(nx<0||nx>=W||ny>=H) return;
          const j=(ny*W+nx)*3;
          if(data[(ny*W+nx)*4+3]<128) return;
          buf[j]+=er*f; buf[j+1]+=eg*f; buf[j+2]+=eb*f;
        };
        spread(1,0,7/16); spread(-1,1,3/16); spread(0,1,5/16); spread(1,1,1/16);
      }
    }
  }
  if(document.getElementById('merge').checked) mergeRareColors(cells);
  const max=curMax();
  if(max<221) reduceToMaxColors(cells,max);
  grid={w:W,h:H,cells};
  render();
  syncPreset();
}

/* 智能减色：把占比过低的杂色并入感知色差最近的保留色，迭代到稳定 */
const colorDistCache=new Map();
function colorDist(a,b){
  const key=a.code<b.code?a.code+"|"+b.code:b.code+"|"+a.code;
  if(!colorDistCache.has(key)){
    colorDistCache.set(key,ciede2000(a.lab[0],a.lab[1],a.lab[2],b.lab[0],b.lab[1],b.lab[2]));
  }
  return colorDistCache.get(key);
}
function mergeRareColors(cells){
  const counts=new Map();
  let total=0;
  for(const c of cells){ if(c){ counts.set(c.code,(counts.get(c.code)||0)+1); total++; } }
  const threshold=Math.max(4,Math.round(total*0.008));
  const byCode=new Map(COLORS.map(c=>[c.code,c]));
  const active=new Set(counts.keys());
  while(true){
    let rarest=null,rc=Infinity;
    for(const code of active){
      const n=counts.get(code);
      if(n<threshold && n<rc){rc=n;rarest=code;}
    }
    if(!rarest) break;
    active.delete(rarest);
    const from=byCode.get(rarest);
    let best=null,bd=Infinity;
    for(const code of active){
      const d=colorDist(from,byCode.get(code));
      if(d<bd){bd=d;best=byCode.get(code);}
    }
    for(let i=0;i<cells.length;i++){
      if(cells[i]&&cells[i].code===rarest) cells[i]=best;
    }
    counts.set(best.code,(counts.get(best.code)||0)+rc);
    counts.delete(rarest);
  }
}
/* 限色：把用到的颜色减到不超过 K 种——每轮把最少的一种并入感知色差最近的保留色 */
function reduceToMaxColors(cells,K){
  const counts=new Map();
  for(const c of cells){ if(c) counts.set(c.code,(counts.get(c.code)||0)+1); }
  const byCode=new Map(COLORS.map(c=>[c.code,c]));
  const active=new Set(counts.keys());
  while(active.size>K){
    let rarest=null,rc=Infinity;
    for(const code of active){
      const n=counts.get(code);
      if(n<rc){rc=n;rarest=code;}
    }
    active.delete(rarest);
    const from=byCode.get(rarest);
    let best=null,bd=Infinity;
    for(const code of active){
      const d=colorDist(from,byCode.get(code));
      if(d<bd){bd=d;best=byCode.get(code);}
    }
    if(!best) break;
    for(let i=0;i<cells.length;i++){
      if(cells[i]&&cells[i].code===rarest) cells[i]=best;
    }
    counts.set(best.code,(counts.get(best.code)||0)+rc);
    counts.delete(rarest);
  }
}

/* 区域实际显示的颜色：自选色 > 已填的画面本色 > 未填 */
function pbApplied(M,r){
  const c=M.custom.get(r.id);
  if(c) return c;
  return M.filled.has(r.id)?r.color:null;
}
/* 编号表：线稿/填色中=画面全色板（未填区域也要有编号可对照），成品预览=最终实际用色 */
function pbLegend(M,kind){
  const list=[],numOf=new Map();
  const key=c=>c.join(',');
  const put=c=>{ const k=key(c); if(!numOf.has(k)){ numOf.set(k,list.length+1); list.push(c); } };
  const eff=r=>M.custom.get(r.id)||r.color;
  if(kind==='blank') M.colors.forEach(put);
  else if(kind==='preview'){
    const used=new Set(); for(const r of M.regions) used.add(key(eff(r)));
    for(const c of M.colors) if(used.has(key(c))) put(c);
    for(const r of M.regions) if(M.custom.has(r.id)) put(eff(r));
  } else {
    for(const c of M.colors) put(c);
    for(const r of M.regions) if(M.custom.has(r.id)) put(eff(r));
  }
  const nums=new Map();
  for(const r of M.regions){
    const c = kind==='blank' ? r.color : (kind==='preview' ? eff(r) : (pbApplied(M,r)||eff(r)));
    nums.set(r.id, numOf.get(key(c)));
  }
  return {list,nums};
}

function pbgBoxBlur(src,W,H){
  const tmp=new Float32Array(src.length), out=new Float32Array(src.length);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)for(let k=0;k<3;k++){
    let s=0,c=0;
    for(let dx=-1;dx<=1;dx++){ const nx=x+dx; if(nx<0||nx>=W) continue; s+=src[(y*W+nx)*3+k]; c++; }
    tmp[(y*W+x)*3+k]=s/c;
  }
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)for(let k=0;k<3;k++){
    let s=0,c=0;
    for(let dy=-1;dy<=1;dy++){ const ny=y+dy; if(ny<0||ny>=H) continue; s+=tmp[(ny*W+x)*3+k]; c++; }
    out[(y*W+x)*3+k]=s/c;
  }
  return out;
}
// 3x3 取众数，压掉孤立碎块；透明像素不参与
function pbgMajority(a,ok,W,H,passes){
  for(let p=0;p<passes;p++){
    const cur=a.slice(), next=a.slice();
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const i=y*W+x;
      if(!ok[i]) continue;
      const tally=new Map();
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        const nx=x+dx, ny=y+dy;
        if(nx<0||ny<0||nx>=W||ny>=H||!ok[ny*W+nx]) continue;
        const v=cur[ny*W+nx]; tally.set(v,(tally.get(v)||0)+1);
      }
      const self=cur[i]; let best=self, bc=tally.get(self)||0;
      for(const [v,c] of tally) if(c>bc){ bc=c; best=v; }
      next[i]=bc>=4?best:self;
    }
    a.set(next);
  }
}
// Marching Squares：二值掩膜取轮廓，外圈补 0 保证贴边也能闭合成环
function pbContours(inner,W,H){
  const mask=new Uint8Array((W+2)*(H+2));
  for(let y=0;y<H;y++)for(let x=0;x<W;x++) mask[(y+1)*(W+2)+(x+1)]=inner[y*W+x];
  const w=W+2, h=H+2, segs=[];
  const at=(x,y)=>mask[y*w+x];
  for(let y=0;y<h-1;y++)for(let x=0;x<w-1;x++){
    const tl=at(x,y), tr=at(x+1,y), br=at(x+1,y+1), bl=at(x,y+1);
    const idx=(tl<<3)|(tr<<2)|(br<<1)|bl;
    if(idx===0||idx===15) continue;
    const T=[x-0.5,y-1], R=[x,y+0.5-1], B=[x-0.5,y], L=[x-1,y+0.5-1];
    let out=null;
    switch(idx){
      case 1: out=[[L,B]]; break;
      case 2: out=[[B,R]]; break;
      case 3: out=[[L,R]]; break;
      case 4: out=[[T,R]]; break;
      case 6: out=[[T,B]]; break;
      case 7: out=[[L,T]]; break;
      case 8: out=[[L,T]]; break;
      case 9: out=[[T,B]]; break;
      case 12: out=[[L,R]]; break;
      case 13: out=[[B,R]]; break;
      case 14: out=[[L,B]]; break;
      case 11: out=[[T,R]]; break;
      case 5: out=((tl+tr+br+bl)>=2)?[[L,T],[B,R]]:[[T,R],[L,B]]; break;
      case 10: out=((tl+tr+br+bl)>=2)?[[T,R],[L,B]]:[[L,T],[B,R]]; break;
    }
    for(const s of out) segs.push(s);
  }
  const key=p=>((p[0]*2)|0)*100000+((p[1]*2)|0);
  const map=new Map();
  segs.forEach((s,i)=>{ for(const p of s){ const k=key(p); if(!map.has(k)) map.set(k,[]); map.get(k).push(i); } });
  const used=new Uint8Array(segs.length), loops=[];

  // 分区线：全局只算一次、只画一次，相邻区域共用同一条曲线；成品预览时不画线
  if(!preview){
    ctx.strokeStyle="#4a4a52"; ctx.lineWidth=Math.max(1,s*0.16);
    for(const c of M.borders){
      ctx.beginPath();
      if(c.closed) pbPath(ctx,[c.pts],s); else pbPathOpen(ctx,c.pts,s);
      ctx.stroke();
    }
  }
  ctx.textAlign="center"; ctx.textBaseline="middle";
  for(const r of M.regions){
    if(preview || r.radius*s<6) continue;   // 成品不叠编号
    const c=ac(r)||[227,228,233];
    const lum=0.299*c[0]+0.587*c[1]+0.114*c[2];
    const t=String(lg.nums.get(r.id));
    ctx.font=`600 ${Math.max(4,Math.min(r.radius*s*0.8,s*6)).toFixed(1)}px sans-serif`;
    ctx.lineWidth=Math.max(1,s*0.24);
    ctx.strokeStyle=lum>140?"rgba(0,0,0,.35)":"rgba(255,255,255,.85)";
    ctx.strokeText(t,r.labelX*s,r.labelY*s);
    ctx.fillStyle=lum>140?"#22252b":"#ffffff";
    ctx.fillText(t,r.labelX*s,r.labelY*s);
  }
  ctx.restore();
  ctx.fillStyle="#222"; ctx.textAlign="left"; ctx.textBaseline="middle";
  ctx.font=`bold ${Math.round(unit*3.4)}px sans-serif`;
  const done=blank?0:M.filled.size;
  const head=blank?"数字油画线稿":(preview?"数字油画成品":"数字油画");
  ctx.fillText(`${head} · ${M.W}×${M.H} · ${lg.list.length} 色 · ${M.regions.length} 个区域${blank||preview?"":" · 已填 "+done}`, margin, margin+titleH*0.5);
  const ly=margin+titleH+M.H*s+chipGap*2;
  let nameFs=Math.round(unit*2.0);
  ctx.font=`${nameFs}px sans-serif`; ctx.textAlign='left';
  let nameWmax=0; names.forEach(n=>{ nameWmax=Math.max(nameWmax, ctx.measureText(`≈${n}`).width); });
  if(nameWmax>chipW-2) nameFs=Math.max(Math.round(unit*1.4), Math.floor(nameFs*(chipW-2)/nameWmax));
  lg.list.forEach((c,i)=>{
    const col=i%perRow, row=(i/perRow)|0;
    const lx=margin+col*(chipW+chipGap), yy=ly+row*(chipH+chipGap+nameH);
    ctx.fillStyle=rgb(c); ctx.fillRect(lx,yy,chipW,chipH);
    ctx.strokeStyle="#bbb"; ctx.lineWidth=0.5; ctx.strokeRect(lx+0.25,yy+0.25,chipW,chipH);
    const lum=0.299*c[0]+0.587*c[1]+0.114*c[2];
    ctx.fillStyle=lum>140?"#22252b":"#ffffff";
    ctx.font=`600 ${Math.round(unit*2.4)}px sans-serif`; ctx.textAlign="center";
    ctx.fillText(`${i+1}号`, lx+chipW/2, yy+chipH/2+0.5);
    ctx.fillStyle="#3d434b"; ctx.textAlign="left";
    ctx.font=`${nameFs}px sans-serif`;
    ctx.fillText(`≈${names[i]}`, lx+2, yy+chipH+nameH*0.62);
  });
  ctx.fillStyle="#3d434b"; ctx.textAlign="left";
  ctx.font=`600 ${listFs}px sans-serif`;
  listLines.forEach((t,i)=>ctx.fillText(t, margin, ly+legendRows*(chipH+chipGap+nameH)+Math.round(listFs*0.9)+i*Math.round(listFs*1.5)));
  ctx.fillStyle="#999"; ctx.textAlign="left";
  ctx.font=`${Math.round(unit*2.6)}px sans-serif`;
  ctx.fillText(blank?`按编号填色 · ${paintRule().foot}`:(preview?"成品预览 · 取消「预览成品」继续填色":"点区域填色 · 画笔可选自动或自选颜色"), margin, canvas.height-footH*0.4);
  return true;
}
function pbSame(a,b){ return !!a&&!!b&&a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2]; }
function pbRGB(c){ return `rgb(${c[0]},${c[1]},${c[2]})`; }
function pbHex(c){ return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join(""); }
function pbFillAt(clientX,clientY){
  const M=paintModel; if(!M) return;
  const cv=document.getElementById('chart'), rc=cv.getBoundingClientRect();
  if(!rc.width||!rc.height) return;
  const x=Math.floor(((clientX-rc.left)*(cv.width/rc.width)-paintGeom.margin)/paintGeom.s);
  const y=Math.floor(((clientY-rc.top)*(cv.height/rc.height)-paintGeom.margin-paintGeom.titleH)/paintGeom.s);
  if(x<0||y<0||x>=M.W||y>=M.H) return;
  const id=M.rid[y*M.W+x];
  if(id<0) return;
  const r=M.regions[id];
  const target=brush?brush.slice():r.color;         // 自动=画面本色，自选=画笔颜色
  const cur=pbApplied(M,r);
  if(cur && pbSame(cur,target)) return;             // 颜色没变就别记一步历史
  M.order.push({id,prevFilled:M.filled.has(id),prevCustom:M.custom.has(id)?M.custom.get(id).slice():undefined});
  M.filled.add(id);
  if(brush && !pbSame(brush,r.color)) M.custom.set(id,brush.slice()); else M.custom.delete(id);
  render();
}
function paintUndo(){
  const M=paintModel; if(!M||!M.order.length) return;
  const e=M.order.pop();
  if(e.prevFilled) M.filled.add(e.id); else M.filled.delete(e.id);
  if(e.prevCustom===undefined) M.custom.delete(e.id);
  else if(e.prevCustom) M.custom.set(e.id,e.prevCustom);
  render();
}
function paintReset(){
  const M=paintModel; if(!M) return;
  M.filled.clear(); M.custom.clear(); M.order.length=0;
  render();
}
/* 调色盘：自动 + 画面出现的颜色 + 自选过的颜色 */
function setBrush(c){
  if(!c) brush=null;
  else {
    brush=c.slice();
    // 不在画面色板里的颜色留在调色盘上，随时能选回来
    if(!customSwatches.some(p=>pbSame(p,brush)) && !(paintModel&&paintModel.colors.some(p=>pbSame(p,brush)))){
      customSwatches.unshift(brush);
      if(customSwatches.length>12) customSwatches.length=12;
    }
  }
  renderTray();
}
function pbSwatch(c,label){
  const b=document.createElement('button');
  b.className='sw'+(brush&&pbSame(brush,c)?' on':'');
  b.style.background=pbRGB(c);
  b.title=(label||'自选色')+' '+pbHex(c)+'（点它当画笔）';
  b.onclick=()=>setBrush(c);
  return b;
}
function renderTray(){
  const wrap=document.getElementById('tray'); if(!wrap) return;
  wrap.innerHTML='';
  if(!isPaint()) return;
  const auto=document.createElement('button');
  auto.className='sw auto'+(brush?'':' on');
  auto.textContent='自动 · 画面本色';
  auto.onclick=()=>setBrush(null);
  wrap.appendChild(auto);
  const pal=paintModel?paintModel.colors:[];
  pal.forEach(c=>wrap.appendChild(pbSwatch(c,'画面色')));
  customSwatches.forEach(c=>{ if(!pal.some(p=>pbSame(p,c))) wrap.appendChild(pbSwatch(c,'自选色')); });
  document.getElementById('trayLabel').textContent=brush?'自选色':'画笔';
}
function paintDataURL(blank){
  const cv=document.createElement('canvas');
  drawPaint(cv,PB_EXPORT_W,!!blank);
  render();
  return cv.toDataURL('image/png');
}
function saveLineArt(){
  if(!paintModel) return;
  const url=paintDataURL(true), name=`数字油画线稿-${paintModel.W}x${paintModel.H}.png`;
  if(HAS_NATIVE){ Android.saveImage(url,name); }
  else { const a=document.createElement('a'); a.download=name; a.href=url; a.click(); }
}
/* 通用表格图：2480px 宽（A4 纵向 300dpi），列宽按权重分，长文本自动缩字号 */
function drawSheet(canvas,o){
  const rows=o.rows; if(!rows||!rows.length) return false;
  const W=2480, pad=Math.round(W*0.05), u=W/100;
  const subFs=Math.round(u*2.0), subLineH=Math.round(u*2.7);
  const footFs=Math.round(u*1.9), footLineH=Math.round(u*2.6);
  const subs=o.sub?pbWrap(o.sub, W-pad*2, subFs):[];
  const foots=o.foot?pbWrap(o.foot, W-pad*2, footFs):[];
  const headH=Math.round(u*10)+Math.max(0,subs.length-1)*subLineH;
  const colHeadH=Math.round(u*5), footH=Math.round(u*6)+Math.max(0,foots.length-1)*footLineH;
  const perCol=o.perCol||26, maxCols=o.maxCols||4;
  const cols=Math.min(maxCols, Math.max(1, Math.ceil(rows.length/perCol)));
  const per=Math.ceil(rows.length/cols);
  const rowH=Math.max(76,Math.min(126,Math.round(2260/per)));
  canvas.width=W; canvas.height=pad*2+headH+colHeadH+per*rowH+footH;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.textBaseline="middle"; ctx.textAlign="left";
  ctx.fillStyle="#222"; ctx.font=`bold ${Math.round(u*3.4)}px sans-serif`;
  ctx.fillText(o.title, pad, pad+Math.round(u*10)*0.32);
  ctx.fillStyle="#8a8a8e"; ctx.font=`${subFs}px sans-serif`;
  subs.forEach((s,i)=>ctx.fillText(s, pad, pad+Math.round(u*10)*0.74+i*subLineH));
  const gap=pad*0.4, colW=(W-pad*2-gap*(cols-1))/cols;
  const wSum=o.cols.reduce((a,c)=>a+c.w,0);
  const cw=o.cols.map(c=>colW*c.w/wSum);
  const top0=pad+headH;
  for(let col=0;col<cols;col++){
    const x0=pad+col*(colW+gap); let hx=x0;
    ctx.fillStyle="#8a8a8e"; ctx.font=`${Math.round(u*1.9)}px sans-serif`; ctx.textAlign="left";
    o.cols.forEach((c,i)=>{ ctx.fillText(c.h, hx+u*0.4, top0+colHeadH*0.5); hx+=cw[i]; });
    ctx.strokeStyle="#c9c9ce"; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(x0,top0+colHeadH); ctx.lineTo(x0+colW,top0+colHeadH); ctx.stroke();
  }
  const top=top0+colHeadH;
  rows.forEach((r,k)=>{
    const col=(k/per)|0, row=k%per;
    const x0=pad+col*(colW+gap), yy=top+row*rowH;
    ctx.strokeStyle="#dfe0e4"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x0,yy+rowH-0.5); ctx.lineTo(x0+colW,yy+rowH-0.5); ctx.stroke();
    let cx=x0;
    o.cols.forEach((c,i)=>{
      const cell=r[i]||{}, ww=cw[i];
      if(c.k==='sw'){
        ctx.fillStyle=cell.hex||"#fff"; ctx.fillRect(cx+u*0.6,yy+rowH*0.24,ww-u*1.2,rowH*0.52);
        ctx.strokeStyle="#c3c3c8"; ctx.lineWidth=1; ctx.strokeRect(cx+u*0.6+0.5,yy+rowH*0.24+0.5,ww-u*1.2-1,rowH*0.52-1);
      } else if(c.k==='blank'){
        ctx.strokeStyle="#d9d9de"; ctx.setLineDash([u*0.8,u*0.8]); ctx.lineWidth=1;
        ctx.strokeRect(cx+u*0.6,yy+rowH*0.2,ww-u*1.2,rowH*0.6); ctx.setLineDash([]);
      } else if(cell.s){
        const num=c.k==='num', mut=c.k==='m';
        ctx.textAlign=num?"center":"left"; ctx.fillStyle=mut?"#777":"#222";
        let fs=Math.round(u*(num?2.5:mut?2.1:2.4));
        const minFs=Math.round(u*(num?1.5:1.6));
        ctx.font=`${num?"600 ":""}${fs}px sans-serif`;
        while(ctx.measureText(cell.s).width>ww-u*(num?0.7:1.2) && fs>minFs){ fs-=1; ctx.font=`${num?"600 ":""}${fs}px sans-serif`; }
        ctx.fillText(cell.s, num?cx+ww/2:cx+u*0.6, yy+rowH/2);
      }
      cx+=ww;
    });
  });
  ctx.fillStyle="#999"; ctx.textAlign="left"; ctx.font=`${footFs}px sans-serif`;
  foots.forEach((s,i)=>ctx.fillText(s, pad, canvas.height-pad*0.45-(foots.length-1-i)*footLineH));
  return true;
}

/* ===== 表格弹窗：先看到表本身，再决定要不要存图 =====
   弹窗里的表格和「导出到相册」的图片共用 sheetData 一份数据，不会出现看到的和存下来的不一致 */
let sheetKind='';
function sheetData(kind){
  if(kind==='sheet'){
    if(!paintModel) return null;
    const M=paintModel, lg=pbLegend(M,pbPreview()?'preview':'work'), sum=paintSummary(M,lg);
    if(!sum.items.length) return null;
    const rule=sum.rule;
    const cols=[{h:'编号',w:0.105,k:'num'},{h:'画面颜色',w:0.16,k:'sw'},{h:rule.col,w:0.29,k:'t'},{h:'用量',w:0.12,k:'m'}];
    const rows=sum.items.map(it=>{ const c=lg.list[it.nums[0]-1];
      return [{s:it.nums.join('+')},{hex:pbRGB(c)},{s:it.name},{s:`${it.cells} 区`}]; });
    return { kind:'sheet', title:'颜料对照表', hint:`${rule.label} · ${sum.items.length}${rule.countWord} · 按用量排序`, copy:false,
      fileName:`颜料对照表-${M.W}x${M.H}.png`, cols, rows,
      sec:`导出图另有「实物颜料（贴/写色号）」空白列：打印后把颜料挤上去、写上管身色号，再照编号上色。`+
          (sum.farN?` △ ${sum.farN} 个没有接近的色，需自行调色。`:''),
      img:{
        title:`颜料对照表 · 数字油画 ${M.W}×${M.H} · ${rule.label} ${sum.items.length}${rule.countWord}`,
        sub:rule.sub+(sum.farN?`（△ ${sum.farN} 个没有接近的色，需自行调色）`:''),
        cols:cols.concat([{h:'实物颜料（贴/写色号）',w:0.325,k:'blank'}]),
        rows:rows.map(r=>r.concat([{s:''}])),
        foot:`泡泡拼豆 · ${rule.label} · 按用量从多到少 · ${rule.merge} · ${rule.srcNote}`
      } };
  }
  if(isPaint()){
    if(!paintModel) return null;
    const M=paintModel, {lg,blobs,labels}=paintNumRows(), sum=paintSummary(M,lg), rule=sum.rule;
    if(!lg.list.length) return null;
    const cols=[{h:'编号',w:0.08,k:'num'},{h:'画面颜色',w:0.14,k:'sw'},{h:'画面色值',w:0.14,k:'mono'},{h:rule.col,w:0.50,k:'t'},{h:'区域数',w:0.14,k:'m'}];
    const rows=lg.list.map((c,i)=>[{s:`${i+1}`},{hex:pbRGB(c)},{s:pbHex(c).toUpperCase()},{s:labels[i]},{s:`${blobs[i]} 区`}]);
    return { kind:'nums', title:'色号表', hint:`${M.W}×${M.H} · ${lg.list.length} 色 · ${M.regions.length} 个区域`, copy:true,
      fileName:`数字油画色号表-${M.W}x${M.H}.png`, cols, rows, sec:sum.text,
      img:{
        title:`色号表 · 数字油画 ${M.W}×${M.H} · ${lg.list.length} 色 · ${M.regions.length} 个区域`,
        sub:`按画面编号排列 · ${rule.label}（${rule.note}）${sum.farN?` · △ ${sum.farN} 个没有接近的色，需自行调色`:''}`,
        cols, rows,
        foot:`泡泡拼豆 · ${rule.foot}`
      } };
  }
  if(!grid) return null;
  const {counts,total,legend}=currentCounts();
  if(!legend.length) return null;
  const cols=[{h:'色号',w:0.16,k:'num'},{h:'颜色',w:0.2,k:'sw'},{h:'数量',w:0.22,k:'m'},{h:'占比',w:0.18,k:'m'}];
  const rows=legend.map(c=>{ const n=counts.get(c.code);
    return [{s:c.code},{hex:c.hex},{s:`${n} 颗`},{s:(n/total*100).toFixed(1)+'%'}]; });
  return { kind:'nums', title:'备料清单', hint:`${legend.length} 种色号 · 共 ${total} 颗`, copy:true,
    fileName:`拼豆备料清单-MARD-${grid.w}x${grid.h}.png`, cols, rows,
    img:{
      title:`备料清单 · MARD 221 色号（A~M） · 图纸 ${grid.w}×${grid.h} 格`,
      sub:`${legend.length} 种色号 · 共 ${total} 颗`,
      cols, rows,
      foot:'泡泡拼豆 · 数量按图纸格子统计，实际用量以色号对应豆子为准'
    } };
}
function sheetTable(d){

/* ===== 图纸渲染 ===== */
function currentCounts(){
  const counts=new Map(); let total=0;
  for(const c of grid.cells){ if(c){ counts.set(c.code,(counts.get(c.code)||0)+1); total++; } }
  return {counts,total,legend:COLORS.filter(c=>counts.has(c.code))};
}
function render(){
  if(isPaint()&&paintModel){ syncPaint(); return drawPaint(document.getElementById('chart'),PB_RENDER_W,false); }
  // 高分辨率 backing：放大看色号不糊。格子上限 64px，总像素封顶 ~16M 防内存爆
  const cell=Math.max(20,Math.min(64,Math.floor(Math.sqrt(16e6/((grid.w+3)*(grid.h+3))))));
  drawChart(document.getElementById('chart'), cell);
  syncPaint();
}

function drawChart(canvas, cell){
  if(!grid) return;
  const {w,h,cells}=grid;
  const {counts,total,legend}=currentCounts();
  const margin=Math.round(cell*1.5);
  const titleH=Math.round(cell*1.5);
  const chipW=Math.round(cell*4.6), chipH=Math.round(cell*1.15), chipGap=Math.round(cell*0.4);
  const perRow=Math.max(1,Math.floor((w*cell+2*margin)/(chipW+chipGap)));
  const legendRows=Math.ceil(legend.length/perRow);
  const legendH=legendRows*(chipH+chipGap)+chipGap*2;
  const footH=Math.round(cell*1.2);
  canvas.width=w*cell+2*margin;
  canvas.height=h*cell+2*margin+titleH+legendH+footH;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
  const ox=margin, oy=margin+titleH;
  // v1.7：导出图去品牌（无 App 名/用户名），单行纯图纸信息 + MARD 标注
  ctx.textAlign="left"; ctx.textBaseline="middle";
  ctx.fillStyle="#222"; ctx.font=`bold ${Math.round(cell*0.8)}px sans-serif`;
  ctx.fillText(`${w}×${h} 格 · ${legend.length} 色 · 共 ${total} 颗 · MARD色号`, 4, titleH*0.5);
  const codeFont=`${Math.max(4,Math.round(cell*0.42))}px sans-serif`;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const c=cells[y*w+x];
      const px=ox+x*cell, py=oy+y*cell;
      if(c){
        ctx.fillStyle=c.hex; ctx.fillRect(px,py,cell,cell);
        if(cell>=9){
          ctx.fillStyle=c.text; ctx.font=codeFont; ctx.textAlign="center";
          ctx.fillText(c.code, px+cell/2, py+cell/2+0.5);
        }
      }
    }
  }
  // 细灰线 + 每5格红线（颂拼豆版式）
  ctx.strokeStyle="#c9c9c9"; ctx.lineWidth=0.5;
  ctx.beginPath();
  for(let x=1;x<w;x++){ if(x%5===0) continue; ctx.moveTo(ox+x*cell,oy); ctx.lineTo(ox+x*cell,oy+h*cell); }
  for(let y=1;y<h;y++){ if(y%5===0) continue; ctx.moveTo(ox,oy+y*cell); ctx.lineTo(ox+w*cell,oy+y*cell); }
  ctx.stroke();
  ctx.strokeStyle="#e0526e"; ctx.lineWidth=Math.max(1,cell*0.08);
  ctx.beginPath();
  for(let x=0;x<=w;x+=5){ ctx.moveTo(ox+x*cell,oy); ctx.lineTo(ox+x*cell,oy+h*cell); }
  for(let y=0;y<=h;y+=5){ ctx.moveTo(ox,oy+y*cell); ctx.lineTo(ox+w*cell,oy+y*cell); }
  ctx.stroke();
  // 四周行列号
  ctx.fillStyle="#888"; ctx.font=`${Math.max(5,Math.round(cell*0.36))}px sans-serif`; ctx.textAlign="center";
  for(let x=0;x<w;x++){
    ctx.fillText(x+1, ox+x*cell+cell/2, oy-cell*0.55);
    ctx.fillText(x+1, ox+x*cell+cell/2, oy+h*cell+cell*0.55);
  }
  for(let y=0;y<h;y++){
    ctx.textAlign="right"; ctx.fillText(y+1, ox-cell*0.3, oy+y*cell+cell/2);
    ctx.textAlign="left"; ctx.fillText(y+1, ox+w*cell+cell*0.3, oy+y*cell+cell/2);
  }
  // 图例：色块内写色号、颗数放块右（颂拼豆样式）
  let ly=oy+h*cell+margin+chipGap;
  legend.forEach((c,i)=>{
    const row=Math.floor(i/perRow), col=i%perRow;
    const lx=ox+col*(chipW+chipGap);
    const yy=ly+row*(chipH+chipGap);
    const boxW=Math.round(chipW*0.52);
    ctx.fillStyle=c.hex; ctx.fillRect(lx,yy,boxW,chipH);
    ctx.strokeStyle="#bbb"; ctx.lineWidth=0.5; ctx.strokeRect(lx+0.25,yy+0.25,boxW,chipH);
    if(cell>=9){
      ctx.fillStyle=c.text; ctx.font=codeFont; ctx.textAlign="center";
      ctx.fillText(c.code, lx+boxW/2, yy+chipH/2+0.5);
      ctx.fillStyle="#222"; ctx.textAlign="left";
      ctx.fillText(String(counts.get(c.code)), lx+boxW+4, yy+chipH/2+0.5);
    }
  });
  ctx.fillStyle="#999"; ctx.font=`${Math.max(5,Math.round(cell*0.38))}px sans-serif`; ctx.textAlign="left";
  const stockActive=document.getElementById('stockOn').checked && parseStock();
  ctx.fillText(stockActive?`色号范围：商家库存 ${activeColors.length} 色 · 配色以实物色卡为准`:`色号体系 MARD 221（A~M）· 配色以实物色卡为准`, 4, canvas.height-footH/2);
  document.getElementById('stats').textContent =
    `${w}×${h} 格 · ${total} 颗豆 · ${legend.length} 种色号${paletteNote(legend.length)} · 双指缩放查看色号`;
}

/* ===== 导出 / 分享 / 清单 / 更新 ===== */
function pbPreview(){ const e=document.getElementById('pbPreview'); return !!(e&&e.checked); }
function exportDataURL(){
  const cv=document.createElement('canvas');
  if(isPaint()&&paintModel) drawPaint(cv,PB_EXPORT_W,false); else drawChart(cv,40);
  const url=cv.toDataURL('image/png');
  render();
  return url;
}
function fileName(){
  if(isPaint()&&paintModel){
    const M=paintModel;
    const customN=M.custom.size;
    return pbPreview()?`数字油画-成品-${M.W}x${M.H}.png`
      :`数字油画-${M.W}x${M.H}-${M.filled.size}区${customN?"-自选"+customN+"区":""}.png`;
  }
  if(!grid) return "拼豆图纸.png";
  return `拼豆图纸-MARD-${grid.w}x${grid.h}.png`;
}

function savePNG(){
  if(!srcImage) return;
  const url=exportDataURL();
  if(HAS_NATIVE){ Android.saveImage(url, fileName()); }
  else { const a=document.createElement('a'); a.download=fileName(); a.href=url; a.click(); }
}
function sharePNG(){
  if(!grid) return;
  const url=exportDataURL();
  if(HAS_NATIVE){ Android.shareImage(url, fileName()); }
  else if(navigator.share){
    fetch(url).then(r=>r.blob()).then(b=>navigator.share({files:[new File([b],fileName(),{type:'image/png'})]})).catch(()=>{});
  } else { savePNG(); }
}
/* 画面编号 -> 就近颜料 -> 区域数：色号表、颜料清单、导出图共用，避免三处算法不一致 */
function paintNumRows(){
  const M=paintModel, lg=pbLegend(M,pbPreview()?'preview':'work');
  const blobs=new Array(lg.list.length).fill(0);
  for(const r of M.regions){ const n=lg.nums.get(r.id); if(n) blobs[n-1]++; }
  return {M,lg,blobs,labels:paintLabels(lg.list,true)};
}
function listText(){
  if(isPaint()&&paintModel){
    const {M,lg,blobs,labels}=paintNumRows();
    const lines=[`数字油画色号表`,`图 ${M.W}×${M.H} · ${lg.list.length} 色 · ${M.regions.length} 个区域${pbPreview()?" · 成品":""}`,""];
    lg.list.forEach((c,i)=>lines.push(`${i+1}号 ${pbHex(c)} ≈${labels[i]} · ${blobs[i]} 区`));
    const sum=paintSummary(M,lg);
    lines.push("",`${sum.rule.label} 颜料清单 ${sum.items.length}${sum.rule.countWord}（${sum.rule.note}${sum.farN?` · △${sum.farN} 需自调`:""}，按用量排序）`);
    sum.items.forEach(it=>lines.push(`  ${it.name} · ${it.nums.join("+")}号 · ${it.cells} 区`));
    lines.push(sum.rule.srcNote+(sum.farN?` · △${sum.farN} 个没有接近的色，需自行调色`:""));
    return lines.join("\n");
  }
  const {counts,total,legend}=currentCounts();
  const lines=[`拼豆备料清单 · MARD 221 色号（A~M）`,`图纸 ${grid.w}×${grid.h} 格 · 共 ${total} 颗 · ${legend.length} 种色号`,""];
  for(const c of legend) lines.push(`${c.code} × ${counts.get(c.code)}`);
  return lines.join("\n");
}
function copyList(){
  if(!srcImage) return;
  const text=listText();
  if(HAS_NATIVE){ Android.copyText(text); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>alert("清单已复制")); }
  else { prompt("长按复制清单：", text); }
}

function checkUpdate(){
  if(HAS_NATIVE){ Android.checkUpdate(); }
  else { alert("请在安卓 App 内使用检查更新"); }
}

/* ===== 事件 ===== */
document.getElementById('file').addEventListener('change',e=>loadFile(e.target.files[0]));
document.getElementById('width').addEventListener('input',e=>{document.getElementById('widthVal').textContent=e.target.value;});
document.getElementById('width').addEventListener('change',regenerate);
document.getElementById('dither').addEventListener('change',regenerate);
document.getElementById('merge').addEventListener('change',regenerate);
/* 预览成品：直接看填完的样子，不重新算模型 */
document.getElementById('pbPreview').addEventListener('change',render);
document.getElementById('fine').addEventListener('input',e=>{document.getElementById('fineVal').textContent=FINE_NAME[fineLevel()-1];});
document.getElementById('fine').addEventListener('change',regenerate);
/* 点一下=填色；拖动和双指缩放不当作填色；预览成品时点击不填色 */
let pbDown=null;
document.getElementById('chart').addEventListener('pointerdown',e=>{
  pbDown={x:e.clientX,y:e.clientY,t:Date.now()};
});
document.getElementById('chart').addEventListener('pointerup',e=>{
  const d=pbDown; pbDown=null;
  if(!d||!isPaint()||!paintModel||pbPreview()) return;
  const moved=Math.hypot(e.clientX-d.x,e.clientY-d.y)*(window.devicePixelRatio||1);
  if(moved>14||Date.now()-d.t>600) return;
  pbFillAt(e.clientX,e.clientY);
});
document.getElementById('chart').addEventListener('pointercancel',()=>pbDown=null);
document.getElementById('maxColors').addEventListener('input',e=>{document.getElementById('maxColorsVal').textContent=e.target.value;});
document.getElementById('maxColors').addEventListener('change',regenerate);
document.getElementById('stockOn').addEventListener('change',()=>{refreshPalette();regenerate();});
document.getElementById('stockCodes').addEventListener('input',updateStockInfo);
document.getElementById('stockCodes').addEventListener('change',()=>{refreshPalette();regenerate();});
document.getElementById('fit').addEventListener('change',e=>{
  document.getElementById('chart').classList.toggle('fit', e.target.checked);
});
/* 常用色预设：一键把限色设到 72/96/144/221；当前用色已≤预设时置灰提示 */
function currentDistinct(){
  if(!grid) return 0;
  const s=new Set();
  for(const c of grid.cells){ if(c) s.add(c.code); }
  return s.size;
}
function syncPreset(){
  const v=curMax(), d=currentDistinct();
  document.getElementById('maxColorsVal').textContent=v;
  document.getElementById('curColors').textContent=grid?`当前 ${d} 色`:"";
  document.querySelectorAll('button.preset').forEach(b=>{
    const n=parseInt(b.dataset.n);
    b.classList.toggle('on', n===v);
    const useless=(n!==221 && n>=d); // 221=不限，任何时候可点
    b.classList.toggle('dim', useless);
    b.title=useless?`当前只用 ${d} 色，限 ${n} 色不会有变化`:"";
  });
}
document.querySelectorAll('button.preset').forEach(b=>b.addEventListener('click',()=>{
  document.getElementById('maxColors').value=b.dataset.n;
  regenerate();
}));
/* 自选颜色：吸管选完即作为当前画笔，并留在调色盘里 */
document.getElementById('customColor').addEventListener('input',e=>{
  const h=e.target.value;
  const c=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  if(!customSwatches.some(p=>pbSame(p,c))) customSwatches.unshift(c);
  if(customSwatches.length>12) customSwatches.length=12;
  setBrush(c);
});
if(HAS_NATIVE){ document.getElementById('ver').textContent = "MARD 221 色号 · v"+Android.version(); }

syncModeUI();
loadSample();
</script>
